name: Deploy via FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Um deploy por vez. Dois envios simultâneos disputam o mesmo servidor e o
# .ftp-deploy-sync-state.json: o mais lento sobrescreve arquivos novos com a
# versão antiga e grava o estado por último (aconteceu em 24/11/2026).
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/uploads/**
            **/screenshots/**
            **/.thumbnail
